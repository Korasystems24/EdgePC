services:
  edgepc:
    build: .
    image: edgepc:local
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file:
      - .env
    environment:
      DB__DIR: /app/data
      LOG__DIR: /app/logs
      TZ: Asia/Krasnoyarsk
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
