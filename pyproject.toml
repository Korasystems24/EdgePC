[project]
name = "edgepc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "tenacity>=9.1.4",
    "zeep>=4.3.3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.32.1",
    "ruff>=0.16.3",
    "types-psutil>=7.2.2.20260518",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Комментарии и сообщения на русском: похожие на латиницу буквы — это норма.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# Каталог alembic/ иначе считается first-party и ломает группировку импортов.
known-third-party = ["alembic"]

# Секцию [tool.pyright] читают и basedpyright, и Pylance.
[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "main.py"]
